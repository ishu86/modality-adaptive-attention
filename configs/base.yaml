# Base configuration for Modality-Adaptive Attention

# Model architecture
model:
  hidden_dim: 768
  num_heads: 12
  num_layers: 6
  ffn_dim: 3072
  max_seq_length: 274  # 197 vision + 77 text tokens
  vocab_size: 50257  # GPT2 tokenizer
  dropout: 0.1

# Vision encoder (frozen CLIP)
vision:
  model_name: "openai/clip-vit-base-patch16"
  num_patches: 196  # 14x14
  patch_dim: 768
  freeze: true

# Text processing
text:
  tokenizer_name: "gpt2"
  max_length: 77

# Data
data:
  train_dataset: "conceptual_captions"
  train_subset_size: 100000  # Start with 100K
  val_dataset: "coco"
  val_split: "validation"
  num_workers: 4
  cache_dir: "./cache"

# Training
training:
  batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 2000
  total_steps: 30000
  max_grad_norm: 1.0
  mixed_precision: true

# Optimizer
optimizer:
  name: "adamw"
  betas: [0.9, 0.999]
  eps: 1.0e-8

# Scheduler
scheduler:
  name: "cosine"

# Checkpointing
checkpoint:
  save_every: 1000
  save_dir: "./checkpoints"

# Logging
logging:
  wandb_project: "modality-adaptive-attention"
  log_every: 100

# Evaluation
evaluation:
  eval_every: 2000
  beam_size: 5
  max_gen_length: 30
